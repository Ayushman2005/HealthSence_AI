[project]
name = "healthrisk-ai-backend"
version = "1.0.0"
description = "FastAPI Backend for HealthRisk AI running on Cloudflare Workers"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
    "supabase>=2.0.0",
    "groq>=0.4.0",
    "python-dotenv>=1.0.0"
]
